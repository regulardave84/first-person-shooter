<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Dark grey concrete texture">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.4 0 0 0 0 0.42 0 0 0 0 0.45 0 0 0 0.22 0"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#2f3640"/>
  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.9"/>
</svg>
